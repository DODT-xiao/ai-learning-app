<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="description" content="AI 学习同步助手：电脑上学习，手机上预习复习，进度云端同步" />
  <title>AI 学习同步助手</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img src="./icons/icon-192.png" alt="" class="brand-icon" />
        <div>
          <h1>AI 学习同步助手</h1>
          <p class="brand-sub">电脑学习 · 手机预习复习 · 云端同步</p>
        </div>
      </div>
      <nav class="tabs" id="tabs">
        <button class="tab active" data-tab="learn">📚 学习</button>
        <button class="tab" data-tab="preview">🔭 预习</button>
        <button class="tab" data-tab="review">🧠 复习</button>
        <button class="tab" data-tab="me">👤 我的</button>
      </nav>
    </div>
  </header>

  <main class="layout">
    <section class="content" id="view-learn"></section>
    <section class="content hidden" id="view-preview"></section>
    <section class="content hidden" id="view-review"></section>
    <section class="content hidden" id="view-me"></section>

    <aside class="sidepanel" id="sidepanel">
      <h2>今日概览</h2>
      <div id="overview"></div>
      <div class="sync-status" id="syncStatus"></div>
    </aside>
  </main>

  <nav class="bottomtabs" id="bottomtabs">
    <button class="tab active" data-tab="learn">📚<span>学习</span></button>
    <button class="tab" data-tab="preview">🔭<span>预习</span></button>
    <button class="tab" data-tab="review">🧠<span>复习</span><em class="badge hidden" id="dueBadge"></em></button>
    <button class="tab" data-tab="me">👤<span>我的</span></button>
  </nav>

  <div class="toast hidden" id="toast"></div>
  <button class="fab hidden" id="selChip" data-action="explainSel">🔍 解释这句</button>
  <button class="fab fab-main" data-action="openGlossary" title="伴学术语速查">🤖</button>

  <script src="./js/data.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
